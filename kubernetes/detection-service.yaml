apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-service
  namespace: retail-intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detection-service
  template:
    metadata:
      labels:
        app: detection-service
    spec:
      containers:
        - name: detection
          image: retail/detection-service:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: retail-config
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: detection-service
  namespace: retail-intel
spec:
  selector:
    app: detection-service
  ports:
    - port: 8090
